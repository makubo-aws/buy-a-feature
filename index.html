<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buy a Feature</title>
<style>
  :root {
    --primary: #0972d3;
    --primary-dark: #065299;
    --primary-light: #e8f4fd;
    --success: #037f0c;
    --danger: #d91515;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #16191f;
    --muted: #687078;
    --border: #dfe3e8;
    --radius: 14px;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 90px;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    background: linear-gradient(135deg, #0972d3 0%, #065299 100%);
    color: white; padding: 24px 16px; text-align: center;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(9,114,211,0.3);
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .header .budget {
    font-size: 40px; font-weight: 800; margin: 10px 0 4px;
    transition: all 0.3s; letter-spacing: -1px;
  }
  .header .budget.over { color: #ff6b6b; }
  .header .budget.low { color: #ffd93d; }
  .header .subtitle { font-size: 13px; opacity: 0.8; max-width: 300px; margin: 0 auto; line-height: 1.4; }

  .container { max-width: 480px; margin: 0 auto; padding: 16px; }

  .company-input {
    background: var(--card); border-radius: var(--radius);
    padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .company-input label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .company-input input {
    width: 100%; padding: 14px; border: 2px solid var(--border);
    border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.2s;
  }
  .company-input input:focus { border-color: var(--primary); }

  .feature-card {
    background: var(--card); border-radius: var(--radius);
    padding: 18px; margin-bottom: 10px; box-shadow: var(--shadow);
    transition: all 0.2s; border-left: 4px solid transparent;
  }
  .feature-card.has-value { border-left-color: var(--primary); background: linear-gradient(135deg, var(--primary-light) 0%, var(--card) 40%); }
  .feature-card .title { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
  .feature-card .desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.4; }
  .feature-card .added-by { font-size: 11px; color: var(--primary); font-style: italic; margin-bottom: 8px; }

  .slider-row { display: flex; align-items: center; gap: 14px; }
  .slider-row input[type=range] {
    flex: 1; accent-color: var(--primary); height: 6px;
    -webkit-appearance: none; background: var(--border); border-radius: 3px; outline: none;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px;
    background: var(--primary); border-radius: 50%; cursor: pointer;
    box-shadow: 0 2px 6px rgba(9,114,211,0.3);
  }
  .slider-row .amount {
    min-width: 52px; text-align: center; font-size: 20px;
    font-weight: 800; color: var(--primary);
  }
  .slider-row .amount.zero { color: var(--border); }

  .quick-btns { display: flex; gap: 6px; margin-top: 10px; }
  .quick-btns button {
    flex: 1; padding: 6px 0; border: 1.5px solid var(--border); border-radius: 8px;
    background: white; font-size: 13px; font-weight: 600; cursor: pointer;
    color: var(--muted); transition: all 0.15s;
  }
  .quick-btns button:active, .quick-btns button.active {
    background: var(--primary); color: white; border-color: var(--primary);
  }

  .section-label {
    font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin: 20px 0 10px; padding-left: 4px;
  }

  .add-feature {
    background: var(--card); border-radius: var(--radius);
    padding: 18px; margin: 8px 0 16px; box-shadow: var(--shadow);
    border: 2px dashed var(--border);
  }
  .add-feature h3 { font-size: 15px; margin-bottom: 12px; color: var(--muted); }
  .add-feature input {
    width: 100%; padding: 12px; border: 2px solid var(--border);
    border-radius: 10px; font-size: 14px; margin-bottom: 8px; outline: none;
  }
  .add-feature input:focus { border-color: var(--primary); }
  .add-feature button {
    width: 100%; padding: 12px; background: var(--bg); border: 2px solid var(--border);
    border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600;
    transition: all 0.15s;
  }
  .add-feature button:active { background: var(--primary); color: white; border-color: var(--primary); }

  .submit-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; padding: 12px 16px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    z-index: 10;
  }
  .submit-bar button {
    width: 100%; max-width: 480px; margin: 0 auto; display: block;
    padding: 16px; background: linear-gradient(135deg, #0972d3 0%, #065299 100%);
    color: white; border: none; border-radius: 12px; font-size: 17px;
    font-weight: 700; cursor: pointer; letter-spacing: -0.2px;
    box-shadow: 0 4px 12px rgba(9,114,211,0.3);
    transition: all 0.2s;
  }
  .submit-bar button:disabled { background: #b0b8c1; cursor: not-allowed; box-shadow: none; }
  .submit-bar button:active:not(:disabled) { transform: scale(0.98); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: white; border-radius: 20px; padding: 36px 28px;
    text-align: center; max-width: 320px; margin: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .overlay-box .icon { font-size: 56px; margin-bottom: 16px; }
  .overlay-box h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .overlay-box p { color: var(--muted); font-size: 14px; line-height: 1.5; }

  .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1 id="appTitle">Buy a Feature</h1>
  <div class="budget" id="budget">$100</div>
  <div class="subtitle" id="appSubtitle">Allocate your budget across the features you value most</div>
</div>

<div class="container">
  <div class="company-input">
    <label for="company">Your Company</label>
    <input type="text" id="company" placeholder="Enter your company name" autocomplete="organization">
  </div>

  <div class="section-label">Features</div>
  <div id="features"></div>

  <div class="section-label">Have an idea?</div>
  <div class="add-feature">
    <h3>💡 Suggest a feature</h3>
    <input type="text" id="newTitle" placeholder="Feature name">
    <input type="text" id="newDesc" placeholder="Brief description (optional)">
    <button onclick="addCustomFeature()">+ Add to list</button>
  </div>
</div>

<div class="submit-bar">
  <button id="submitBtn" onclick="submitAllocations()">Submit My Picks</button>
</div>

<div class="overlay" id="successOverlay">
  <div class="overlay-box">
    <div class="icon">✅</div>
    <h2>Thank you!</h2>
    <p>Your investment choices have been recorded. Your input helps shape what we build next.</p>
  </div>
</div>

<div class="overlay" id="errorOverlay">
  <div class="overlay-box">
    <div class="icon">⚠️</div>
    <h2>Oops</h2>
    <p id="errorMsg">Something went wrong. Please try again.</p>
    <button onclick="document.getElementById('errorOverlay').classList.remove('show')" style="margin-top:16px;padding:10px 24px;background:var(--primary);color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer">OK</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const BUDGET = CONFIG.budget || 100;
let features = [...CONFIG.features];
let allocations = {};
let customFeatures = [];

function init() {
  document.getElementById("appTitle").textContent = CONFIG.title || "Buy a Feature";
  document.getElementById("appSubtitle").textContent = CONFIG.subtitle || "";
  render();
}

function render() {
  const container = document.getElementById("features");
  container.innerHTML = features.map(f => {
    const val = allocations[f.id] || 0;
    const addedBy = f.addedBy ? `<div class="added-by">Suggested by ${esc(f.addedBy)}</div>` : "";
    return `
      <div class="feature-card ${val > 0 ? "has-value" : ""}" id="card-${f.id}">
        <div class="title">${esc(f.title)}</div>
        <div class="desc">${esc(f.description)}</div>
        ${addedBy}
        <div class="slider-row">
          <input type="range" min="0" max="${BUDGET}" step="5" value="${val}"
            oninput="setAlloc('${f.id}', +this.value)"
            aria-label="Investment for ${esc(f.title)}">
          <div class="amount ${val === 0 ? 'zero' : ''}">$${val}</div>
        </div>
        <div class="quick-btns">
          <button onclick="setAlloc('${f.id}', 0)" class="${val===0?'active':''}">$0</button>
          <button onclick="setAlloc('${f.id}', 10)" class="${val===10?'active':''}">$10</button>
          <button onclick="setAlloc('${f.id}', 25)" class="${val===25?'active':''}">$25</button>
          <button onclick="setAlloc('${f.id}', 50)" class="${val===50?'active':''}">$50</button>
        </div>
      </div>`;
  }).join("");
  updateBudget();
}

function setAlloc(id, val) {
  allocations[id] = val;
  render();
}

function updateBudget() {
  const spent = Object.values(allocations).reduce((a, b) => a + b, 0);
  const remaining = BUDGET - spent;
  const el = document.getElementById("budget");
  el.textContent = `$${remaining}`;
  el.classList.toggle("over", remaining < 0);
  el.classList.toggle("low", remaining > 0 && remaining <= 20);
  document.getElementById("submitBtn").disabled = remaining < 0;
}

function addCustomFeature() {
  const title = document.getElementById("newTitle").value.trim();
  const desc = document.getElementById("newDesc").value.trim();
  if (!title) return;
  const id = "custom-" + Date.now();
  const feat = { id, title, description: desc || "Customer-suggested feature" };
  features.push(feat);
  customFeatures.push(feat);
  document.getElementById("newTitle").value = "";
  document.getElementById("newDesc").value = "";
  render();
  // Scroll to the new card
  setTimeout(() => document.getElementById("card-" + id)?.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
}

async function submitAllocations() {
  const company = document.getElementById("company").value.trim();
  if (!company) { showError("Please enter your company name."); return; }

  const spent = Object.values(allocations).reduce((a, b) => a + b, 0);
  if (spent === 0) { showError("Please allocate at least some budget."); return; }
  if (spent > BUDGET) { showError(`You've exceeded the $${BUDGET} budget.`); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting...';

  // Build row data: timestamp, company, then each feature allocation
  const row = {
    timestamp: new Date().toISOString(),
    company: company,
    allocations: {},
    customFeatures: customFeatures
  };
  features.forEach(f => {
    row.allocations[f.title] = allocations[f.id] || 0;
  });
  row.total = spent;

  try {
    await fetch(CONFIG.scriptUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(row)
    });
    // no-cors means we can't read the response, but the data is sent
    document.getElementById("successOverlay").classList.add("show");
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Submit My Picks";
    showError("Failed to submit. Please check your connection and try again.");
  }
}

function showError(msg) {
  document.getElementById("errorMsg").textContent = msg;
  document.getElementById("errorOverlay").classList.add("show");
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

init();
</script>
</body>
</html>
